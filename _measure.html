<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>measure</title></head>
<body>
<pre id="out">loading</pre>
<iframe id="f" src="/index.html" style="width:1440px;height:1000px;border:0"></iframe>
<script>
const out = document.getElementById('out');
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const d = f.contentDocument;
      const rect = el => el ? {w: Math.round(el.getBoundingClientRect().width), h: Math.round(el.getBoundingClientRect().height)} : null;
      out.textContent = JSON.stringify({
        welcome: rect(d.querySelector('.home-top-layout > .home-welcome')),
        recommendedRailSection: rect(d.querySelector('.home-recommended-rail')),
        recommendedRail: rect(d.querySelector('.home-recommended-rail .library-rail')),
        firstCard: rect(d.querySelector('.home-recommended-rail .library-card')),
        cardImg: rect(d.querySelector('.home-recommended-rail .card-img-wrap')),
        cardTitle: rect(d.querySelector('.home-recommended-rail .card-title')),
        layout: rect(d.querySelector('.home-top-layout'))
      }, null, 2);
    } catch (e) {
      out.textContent = 'ERR ' + e.message;
    }
  }, 4500);
});
</script>
</body></html>
